name: Update rankings and deploy Pages

on:
  schedule:
    - cron: '0 5 * * *'
      timezone: Asia/Seoul
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: stoneage-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rankings:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Collect and publish changed rankings
        run: |
          before="$(mktemp)"
          cp data/pet_rankings.json "$before"
          node tools/scrape_pet_rankings.js
          node -e 'const r = require("./data/pet_rankings.json"); if (!r.summary.totalRankingRows) process.exit(1)'
          result=0
          node tools/compare_pet_rankings.js "$before" data/pet_rankings.json || result=$?
          case "$result" in
            0) exit 0 ;;
            2) ;;
            *) exit "$result" ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/pet_rankings.json
          git commit -m "Update pet ranking data"
          git push origin HEAD:main

  deploy:
    needs: rankings
    if: ${{ always() && github.ref == 'refs/heads/main' && (needs.rankings.result == 'success' || needs.rankings.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Prepare static files
        run: |
          mkdir _site
          cp -r index.html css data images js _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
